name: AI Policy Reminder

on:
  pull_request:
    types: [opened]

jobs:
  ai-guidelines-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            
            // TODO: Move this message template to a separate config file or Wiki later
            const body = `
            👋 **Thanks for your contribution!**
            
            🤖 **AI Usage Policy Reminder**
            Per Sugar Labs guidelines, if you used generative AI tools (ChatGPT, Claude, Copilot, etc.) to create this code, you **must disclose it** in the PR description.
            
            **Please include:**
            1. The specific prompts you used.
            2. The full conversation history (link or summary).
            
            > *If you did not use AI, you can ignore this message.*
            
            Happy coding! 🚀
            `;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });
